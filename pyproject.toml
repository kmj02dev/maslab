[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maslab"
version = "0.1.0"
description = "Multi-agent decision-making experiment primitives"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
hf = [
    "torch>=2.0",
    "transformers>=4.45,<6",
    "accelerate>=0.26,<2",
]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maslab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
